<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polski dla Ciebie — Polonês para você</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12203E;
    --bg-2: #0D1830;
    --surface: #1B2C50;
    --surface-2: #223460;
    --gold: #D6A429;
    --gold-dim: #9c7c2f;
    --crimson: #C1392B;
    --text: #F2ECDA;
    --text-muted: #93A4C4;
    --line: #33456E;
    --good: #6FA97A;
    --bad: #C1544A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    background-image:
      radial-gradient(ellipse at top left, rgba(214,164,41,0.08), transparent 45%),
      radial-gradient(ellipse at bottom right, rgba(193,57,43,0.07), transparent 50%);
    color: var(--text);
    font-family: 'Work Sans', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  ::selection{ background: var(--gold); color: var(--bg-2); }
  a, button { font-family: inherit; }

  .wrap{ max-width: 880px; margin: 0 auto; padding: 28px 20px 80px; }

  header.top{
    display:flex; justify-content: space-between; align-items: flex-end;
    gap: 16px; padding-bottom: 18px; margin-bottom: 4px;
  }
  .brand{ display:flex; flex-direction: column; gap: 4px; }
  .brand .mark{ font-family:'Fraunces', serif; font-weight:600; font-size: 1.9rem; letter-spacing: -0.01em; line-height:1; }
  .brand .mark em{ font-style: normal; color: var(--gold); }
  .brand .sub{ font-size: 0.85rem; color: var(--text-muted); }
  .progress-pill{ font-size: 0.78rem; color: var(--text-muted); text-align:right; line-height:1.5; }
  .progress-pill b{ color: var(--gold); font-weight:600; }

  .tabs{
    display:flex; gap: 2px; border: 1px solid var(--line);
    margin-bottom: 28px;
  }
  .tabs button{
    flex:1; background: var(--surface); color: var(--text-muted); border:none;
    padding: 12px 10px; font-size: 0.88rem; cursor:pointer; font-weight:500;
    border-bottom: 2px solid transparent;
  }
  .tabs button.active{ background: var(--surface-2); color: var(--gold); border-bottom-color: var(--gold); font-weight:600; }
  .tabs button:hover:not(.active){ color: var(--text); }

  .lead{ font-family:'Fraunces', serif; font-size: clamp(1.3rem, 3.6vw, 1.9rem); line-height: 1.3; max-width: 640px; margin: 0 0 26px; font-weight: 500; }

  /* HOME GRID (frases + gramática) */
  .chapters{ display:grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 2px; background: var(--line); border: 1px solid var(--line); }
  .chapter{ background: var(--surface); padding: 20px 18px; cursor:pointer; display:flex; flex-direction:column; gap: 10px; text-align:left; border:none; color: inherit; position:relative; transition: background .15s ease; }
  .chapter:hover{ background: var(--surface-2); }
  .chapter:focus-visible{ outline: 2px solid var(--gold); outline-offset: -2px; }
  .chapter .num{ font-family:'Fraunces', serif; font-size: 0.85rem; color: var(--gold-dim); letter-spacing: 0.04em; }
  .chapter .title{ font-family:'Fraunces', serif; font-size: 1.18rem; font-weight: 600; }
  .chapter .desc{ font-size: 0.8rem; color: var(--text-muted); line-height:1.4; }
  .chapter .meta{ font-size: 0.78rem; color: var(--text-muted); display:flex; justify-content: space-between; align-items:center; margin-top: 4px; }
  .bar-track{ height: 3px; background: var(--bg-2); width: 100%; margin-top: 2px; }
  .bar-fill{ height: 100%; background: var(--gold); }

  .backbtn{ background:none; border:none; color: var(--text-muted); font-size: 0.85rem; cursor:pointer; padding: 0 0 18px; display:flex; align-items:center; gap:6px; }
  .backbtn:hover{ color: var(--gold); }

  .cat-header{ display:flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 14px; margin-bottom: 22px; }
  .cat-header .title{ font-family:'Fraunces', serif; font-size: 1.8rem; font-weight:600; }
  .mode-toggle{ display:flex; gap: 2px; border: 1px solid var(--line); }
  .mode-toggle button{ background: var(--surface); color: var(--text-muted); border: none; padding: 8px 14px; font-size: 0.82rem; cursor: pointer; }
  .mode-toggle button.active{ background: var(--gold); color: var(--bg-2); font-weight: 600; }

  /* LIST MODE */
  .phrase-row{ display:grid; grid-template-columns: 1fr 1fr auto; gap: 14px; align-items:center; padding: 16px 4px; border-bottom: 1px solid var(--line); }
  .phrase-row .pt{ font-size: 0.95rem; color: var(--text-muted); }
  .phrase-row .pl-block .pl{ font-family:'Fraunces', serif; font-size: 1.15rem; font-weight: 500; }
  .phrase-row .pl-block .phon{ font-size: 0.78rem; color: var(--gold-dim); font-style: italic; margin-top: 2px; }
  .play-btn{ width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--gold); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size: 1rem; }
  .play-btn:hover{ border-color: var(--gold); background: rgba(214,164,41,0.08); }
  .play-btn.playing{ background: var(--gold); color: var(--bg-2); }
  .play-btn.mini{ width:30px; height:30px; font-size:0.85rem; }

  @media (max-width: 560px){
    .phrase-row{ grid-template-columns: 1fr auto; }
    .phrase-row .pt{ grid-column: 1 / -1; order: 2; }
    .phrase-row .pl-block{ order:1; }
    .phrase-row .play-btn{ order:1; }
  }

  /* FLASHCARD MODE */
  .flash-wrap{ display:flex; flex-direction:column; align-items:center; gap: 22px; padding: 20px 0 10px; }
  .flash-progress{ font-size: 0.8rem; color: var(--text-muted); }
  .flashcard{ width: 100%; max-width: 440px; min-height: 220px; background: var(--surface); border: 1px solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; gap: 14px; padding: 30px 24px; text-align:center; cursor:pointer; position:relative; }
  .flashcard .side-label{ position:absolute; top:14px; left:16px; font-size: 0.68rem; letter-spacing: 0.06em; color: var(--text-muted); }
  .flashcard .main{ font-family:'Fraunces', serif; font-size: 1.7rem; font-weight: 600; }
  .flashcard .phon{ color: var(--gold); font-style: italic; font-size: 0.95rem; }
  .flashcard .hint{ color: var(--text-muted); font-size: 0.78rem; margin-top: 6px; }
  .flash-controls{ display:flex; gap: 10px; flex-wrap:wrap; justify-content:center; }
  .flash-controls button{ padding: 10px 20px; border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor:pointer; font-size: 0.85rem; }
  .flash-controls .know{ border-color: var(--good); color: var(--good); }
  .flash-controls .know:hover{ background: rgba(111,169,122,0.12); }
  .flash-controls .dontknow{ border-color: var(--bad); color: var(--bad); }
  .flash-controls .dontknow:hover{ background: rgba(193,84,74,0.12); }
  .flash-controls .say{ border-color: var(--gold); color: var(--gold); }

  /* QUIZ */
  .quiz-box{ background: var(--surface); border: 1px solid var(--line); padding: 28px 24px; max-width: 520px; margin: 0 auto; }
  .quiz-progress{ font-size: 0.78rem; color: var(--text-muted); margin-bottom: 14px; }
  .quiz-question{ font-family:'Fraunces', serif; font-size: 1.4rem; margin-bottom: 22px; }
  .quiz-question small{ display:block; color: var(--text-muted); font-family:'Work Sans', sans-serif; font-size: 0.75rem; margin-bottom: 6px; }
  .quiz-opts{ display:flex; flex-direction:column; gap: 8px; }
  .quiz-opt{ text-align:left; padding: 13px 16px; border: 1px solid var(--line); background: var(--bg-2); color: var(--text); cursor:pointer; font-size: 0.95rem; font-family:'Fraunces', serif; }
  .quiz-opt:hover{ border-color: var(--gold); }
  .quiz-opt.correct{ border-color: var(--good); background: rgba(111,169,122,0.14); }
  .quiz-opt.wrong{ border-color: var(--bad); background: rgba(193,84,74,0.14); }
  .quiz-opt[disabled]{ cursor:default; }
  .quiz-result{ text-align:center; padding: 30px 10px; }
  .quiz-result .score{ font-family:'Fraunces', serif; font-size: 2.4rem; color: var(--gold); }
  .quiz-result .best{ color: var(--text-muted); font-size: 0.85rem; margin-top: 4px; }
  .primary-btn{ margin-top: 20px; background: var(--crimson); color: #F8ECE9; border:none; padding: 12px 22px; cursor:pointer; font-size: 0.88rem; font-weight: 600; }
  .primary-btn:hover{ background: #a92f22; }
  .ghost-btn{ margin-top: 10px; background: none; border:none; color: var(--text-muted); cursor:pointer; font-size: 0.82rem; text-decoration: underline; }
  .quiz-launch{ text-align:center; padding: 10px 0 6px; }
  .quiz-launch p{ color: var(--text-muted); max-width: 420px; margin: 8px auto 20px; font-size: 0.9rem;}

  footer.note{ margin-top: 50px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 0.76rem; color: var(--text-muted); line-height: 1.6; }

  /* ESCRITA + GRAMÁTICA content blocks */
  .content-section{ margin-bottom: 40px; }
  .content-section h2{ font-family:'Fraunces', serif; font-size: 1.35rem; font-weight:600; margin: 0 0 6px; color: var(--gold); }
  .content-section .section-intro{ color: var(--text-muted); font-size: 0.9rem; margin-bottom: 16px; max-width: 640px; }
  .gp{ font-size: 0.94rem; line-height: 1.65; color: var(--text); margin: 0 0 14px; max-width: 680px; }
  .gp b{ color: var(--gold); font-weight:600; }
  .gh{ font-family:'Fraunces', serif; font-size: 1.05rem; font-weight:600; margin: 22px 0 8px; }
  .glist{ margin: 0 0 14px; padding-left: 20px; font-size: 0.92rem; line-height:1.7; color: var(--text); }
  .glist li{ margin-bottom: 4px; }
  .glist b{ color: var(--gold); }

  table.gtable{ width:100%; border-collapse: collapse; margin: 6px 0 22px; font-size: 0.86rem; }
  table.gtable th{ text-align:left; color: var(--text-muted); font-weight:500; font-size: 0.72rem; letter-spacing:0.03em; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  table.gtable td{ padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.gtable td.pl-cell{ font-family:'Fraunces', serif; color: var(--gold); font-weight:500; }
  table.gtable tr:hover td{ background: rgba(214,164,41,0.04); }

  .example-row{ display:flex; align-items:center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .example-row .ex-text{ flex:1; }
  .example-row .ex-pl{ font-family:'Fraunces', serif; font-size: 1.02rem; color: var(--gold); }
  .example-row .ex-phon{ font-size: 0.76rem; color: var(--gold-dim); font-style: italic; }
  .example-row .ex-pt{ font-size: 0.82rem; color: var(--text-muted); margin-top: 2px; }

  .lesson-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 2px; background: var(--line); border: 1px solid var(--line); margin-top: 4px; }
</style>
</head>

/* ============== STATE ============== */
let state = {
  section:'frases', // 'frases' | 'escrita' | 'gramatica'
  view:'home', catId:null, mode:'list', flashIndex:0, flashFlipped:false,
  quiz:null, mastery:{}, gramLesson:null
};

/* ============== STORAGE ============== */
async function loadMastery(){
  try{ const r = await window.storage.get('mastery-data'); state.mastery = r ? JSON.parse(r.value) : {}; }
  catch(e){ state.mastery = {}; }
}
async function saveMastery(){ try{ await window.storage.set('mastery-data', JSON.stringify(state.mastery)); }catch(e){} }
async function loadBest(catId){
  try{ const r = await window.storage.get('quiz-best:'+catId); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function saveBest(catId, score, total){
  try{
    const cur = await loadBest(catId);
    if(!cur || score > cur.score) await window.storage.set('quiz-best:'+catId, JSON.stringify({score, total}));
  }catch(e){}
}
function phraseKey(catId, idx){ return catId+':'+idx; }
function catMasteryPct(cat){
  const total = cat.phrases.length; let known=0;
  cat.phrases.forEach((_,i)=>{ if(state.mastery[phraseKey(cat.id,i)]) known++; });
  return Math.round(100*known/total);
}
function overallPct(){
  let total=0, known=0;
  CATEGORIES.forEach(c=>{ total+=c.phrases.length; c.phrases.forEach((_,i)=>{ if(state.mastery[phraseKey(c.id,i)]) known++; }); });
  return total? Math.round(100*known/total) : 0;
}

/* ============== TTS ============== */
let polishVoice = null;
function pickVoice(){
  const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  polishVoice = voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('pl')) || null;
}
if('speechSynthesis' in window){ pickVoice(); window.speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, btn){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'pl-PL'; if(polishVoice) u.voice = polishVoice; u.rate = 0.88;
  if(btn){ btn.classList.add('playing'); u.onend = ()=> btn.classList.remove('playing'); u.onerror = ()=> btn.classList.remove('playing'); }
  window.speechSynthesis.speak(u);
}

    if(state.view==='quiz-result') return renderQuizResult();
  }
  if(state.section==='escrita') return renderEscrita();

  body.querySelectorAll('.play-btn').forEach(btn=>{
    btn.onclick = ()=> speak(cat.phrases[+btn.dataset.idx][1], btn);
  });
}

function renderFlash(body, cat){
  const i = state.flashIndex; const p = cat.phrases[i]; const flipped = state.flashFlipped;
  body.innerHTML = `
    <div class="flash-wrap">
      <div class="flash-progress">Cartão ${i+1} de ${cat.phrases.length}</div>
      <div class="flashcard" id="fc">
        <div class="side-label">${flipped ? 'POLONÊS' : 'PORTUGUÊS'}</div>
        <div class="main">${flipped ? p[1] : p[0]}</div>
        ${flipped ? `<div class="phon">${p[2]}</div>` : ''}
        <div class="hint">${flipped ? 'toque para voltar' : 'toque para revelar em polonês'}</div>
      </div>
      <div class="flash-controls">
        <button class="say">🔊 ouvir</button>
        <button class="dontknow">não sabia</button>
        <button class="know">eu sabia</button>
      </div>
    </div>
  `;
  document.getElementById('fc').onclick = ()=>{ state.flashFlipped = !state.flashFlipped; renderFlash(body, cat); };
  body.querySelector('.say').onclick = (e)=>{ e.stopPropagation(); speak(p[1]); };
  body.querySelector('.know').onclick = (e)=>{ e.stopPropagation(); markFlash(cat,i,true); };
  body.querySelector('.dontknow').onclick = (e)=>{ e.stopPropagation(); markFlash(cat,i,false); };
}

function markFlash(cat, i, known){
  state.mastery[phraseKey(cat.id,i)] = known;
  saveMastery();
  state.flashIndex = (i < cat.phrases.length-1) ? i+1 : 0;
  state.flashFlipped = false;
  const body = document.getElementById('catbody');
  renderFlash(body, cat);
  const pill = document.querySelector('.progress-pill b');
  if(pill) pill.textContent = overallPct()+'%';
}

      <p style="color:var(--text-muted);font-size:0.9rem;">${Math.min(cat.phrases.length,8)} perguntas de português → polonês, com múltipla escolha.</p>
      <button class="primary-btn" id="go">Começar</button>
    </div>
  `;
  bindTabs();
  document.getElementById('back').onclick = ()=>{ state.view='category'; render(); };
  document.getElementById('go').onclick = ()=> startQuiz(cat);
}

function startQuiz(cat){
  const n = Math.min(cat.phrases.length, 8);
  const idxs = [...cat.phrases.keys()]; shuffle(idxs);
  const chosen = idxs.slice(0,n);
  const questions = chosen.map(qi=>{
    const correct = cat.phrases[qi];
    let distractors = cat.phrases.filter((_,i)=>i!==qi).map(p=>p[1]);
    shuffle(distractors); distractors = distractors.slice(0,3);
    const options = shuffle([correct[1], ...distractors]);
    return { pt: correct[0], correct: correct[1], options, phon: correct[2] };
  });
  state.quiz = { cat, questions, index:0, score:0, answered:false };
  state.view='quiz'; render();
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}

function renderQuiz(){
  const q = state.quiz; const cur = q.questions[q.index];
  app.innerHTML = `
    ${headerHTML()}
    <div class="quiz-box">
      <div class="quiz-progress">Pergunta ${q.index+1} de ${q.questions.length} · acertos: ${q.score}</div>
      <div class="quiz-question"><small>Como se diz em polonês?</small>${cur.pt}</div>
      <div class="quiz-opts" id="opts">
        ${cur.options.map((o,i)=>`<button class="quiz-opt" data-opt="${i}">${o}</button>`).join('')}
      </div>
    </div>
  `;
  bindTabs();
  app.querySelectorAll('.quiz-opt').forEach(btn=>{
    btn.onclick = ()=>{
      if(q.answered) return; q.answered = true;
      const chosen = cur.options[+btn.dataset.opt];
      const isCorrect = chosen === cur.correct;
      if(isCorrect) q.score++;
      app.querySelectorAll('.quiz-opt').forEach(b=>{
        b.disabled = true;
        if(b.textContent === cur.correct) b.classList.add('correct');
        else if(b===btn) b.classList.add('wrong');
      });
      speak(cur.correct);
      setTimeout(()=>{
        if(q.index < q.questions.length-1){ q.index++; q.answered=false; renderQuiz(); }
        else { state.view='quiz-result'; render(); }
      }, 950);
    };
  });
}

async function renderQuizResult(){
  const q = state.quiz;
  await saveBest(q.cat.id, q.score, q.questions.length);
  const best = await loadBest(q.cat.id);
  app.innerHTML = `
    ${headerHTML()}
    <div class="quiz-box quiz-result">
      <div style="font-size:0.85rem;color:var(--text-muted);">Quiz — ${q.cat.title}</div>
      <div class="score">${q.score} / ${q.questions.length}</div>
      <div class="best">${best ? 'melhor resultado: '+best.score+' / '+best.total : ''}</div>
      <button class="primary-btn" id="again">Tentar de novo</button><br>
      <button class="ghost-btn" id="toCategory">voltar ao capítulo</button>
    </div>
  `;
  bindTabs();
  document.getElementById('again').onclick = ()=> startQuiz(q.cat);
  document.getElementById('toCategory').onclick = ()=>{ state.view='category'; render(); };
}

/* ============== ESCRITA ============== */
function renderBlocks(blocks){
  return blocks.map(b=>{
    if(b.type==='p') return `<p class="gp">${b.text}</p>`;
    if(b.type==='h') return `<div class="gh">${b.text}</div>`;
    if(b.type==='list') return `<ul class="glist">${b.items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
    if(b.type==='table'){
      return `<table class="gtable"><thead><tr>${b.headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
      <tbody>${b.rows.map(r=>`<tr>${r.map((c,i)=>`<td${i===0?' class="pl-cell"':''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    }
    if(b.type==='example'){
      return `<div class="example-row">
        <div class="ex-text"><div class="ex-pl">${b.pl}</div><div class="ex-phon">${b.phon}</div><div class="ex-pt">${b.pt}</div></div>
        <button class="play-btn mini" data-say="${b.pl.replace(/"/g,'&quot;')}" title="Ouvir">🔊</button>
      </div>`;
    }
    return '';
  }).join('');
}
function bindBlockAudio(container){
  container.querySelectorAll('[data-say]').forEach(btn=>{
    btn.onclick = ()=> speak(btn.dataset.say, btn);
  });
}

function renderEscrita(){
  app.innerHTML = `
    ${headerHTML()}

      ${renderBlocks(ESCRITA_INTRO)}
      <table class="gtable">

            <td>${a[3]}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>

    <div class="content-section">

      <table class="gtable">
        <thead><tr><th>Dígrafo</th><th>Como soa</th><th>Exemplo</th><th>Significado</th></tr></thead>
        <tbody>
          ${DIGRAPHS.map(a=>`<tr>
            <td class="pl-cell">${a[0]}</td><td>${a[1]}</td>

/* ============== GRAMÁTICA ============== */
function renderGrammarGrid(){
  const lessons = GRAMMAR.map(l=>`
    <button class="chapter" data-lesson="${l.id}">
      <div class="num">Lição ${l.num}</div>
      <div class="title">${l.title}</div>
      <div class="desc">${l.desc}</div>
    </button>
  `).join('');
  app.innerHTML = `
    ${headerHTML()}
    <p class="lead">Uma introdução direta à gramática polonesa, pensada para quem parte do português — com o que muda, o que se parece, e o que é totalmente novo.</p>
    <div class="lesson-grid">${lessons}</div>
    <footer class="note">A gramática polonesa tem um elemento sem equivalente em português — os 7 casos gramaticais. Não é preciso dominar tudo de uma vez: comece pelas primeiras lições e volte às demais aos poucos.</footer>
  `;
  bindTabs();
  app.querySelectorAll('.chapter').forEach(btn=>{
    btn.onclick = ()=>{ state.gramLesson = btn.dataset.lesson; render(); };
  });
}

function currentLesson(){ return GRAMMAR.find(l=>l.id===state.gramLesson); }

function renderGrammarLesson(){
  const l = currentLesson();
  app.innerHTML = `
    ${headerHTML()}
    <button class="backbtn" id="back">← todas as lições</button>
    <div class="cat-header"><div class="title">${l.num} · ${l.title}</div></div>
    <div class="content-section">${renderBlocks(l.blocks)}</div>
  `;
  bindTabs();
  document.getElementById('back').onclick = ()=>{ state.gramLesson=null; render(); };
  bindBlockAudio(app);
}

(async function init(){
  await loadMastery();
  render();
})();
